  ssh-target:
    image: lscr.io/linuxserver/openssh-server
    container_name: webinar_demos_ssh_target
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=airflow
      - USER_PASSWORD=airflow
      - SUDO_ACCESS=false
    ports:
      - "2222:2222"  # sshd (test from host: ssh -p 2222 airflow@localhost)
    networks:
      - airflow

  scheduler:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - airflow

  triggerer:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - airflow

volumes:
  postgres_data:
    driver: local
  spark_data:
    driver: local

networks:
  airflow:
    external: false 