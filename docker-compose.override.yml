services:
  spark-master:
    image: apache/spark:4.0.0
    container_name: webinar_demos_spark_master
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
      - SPARK_MASTER_OPTS=-Dspark.master.rest.enabled=true -Dspark.master.rest.port=6066
    ports:
      - "8081:8080"  # Spark Master Web UI
      - "7077:7077"  # Spark Master Port
      - "6066:6066"  # Spark Standalone REST submission API (cluster-mode submit + driver status)
      - "10000:10000"  # Thrift Server Port
    volumes:
      - spark_data:/opt/spark/data
    networks:
      - airflow
    command: |
      bash -c "
        /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080 &
        sleep 10
        /opt/spark/sbin/start-thriftserver.sh --master spark://spark-master:7077 --total-executor-cores 1 --hiveconf hive.server2.thrift.port=10000 --hiveconf hive.server2.thrift.bind.host=0.0.0.0 &
        wait
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  spark-worker:
    image: apache/spark:4.0.0
    container_name: webinar_demos_spark_worker
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=6g
      - SPARK_WORKER_CORES=6
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - SPARK_USER=spark
    ports:
      - "8082:8081"  # Spark Worker Web UI
    volumes:
      - spark_data:/opt/spark/data
    networks:
      - airflow
    command: |
      bash -c "
        /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --host spark-worker --port 8081 --webui-port 8081 spark://spark-master:7077
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  spark-connect:
    image: apache/spark:4.0.0
    container_name: webinar_demos_spark_connect
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_USER=spark
    ports:
      - "15002:15002"  # Spark Connect gRPC
    networks:
      - airflow
    command: |
      bash -c "
        /opt/spark/sbin/start-connect-server.sh \
          --packages org.apache.spark:spark-connect_2.13:4.0.0 \
          --master spark://spark-master:7077 \
          --total-executor-cores 1 \
          --conf spark.connect.grpc.binding.host=0.0.0.0 \
          --conf spark.connect.grpc.binding.port=15002
      "
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/15002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

